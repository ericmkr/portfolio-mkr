<!DOCTYPE html>
<html lang="en">

    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      
      <meta name="author" content="Eric Moukouri">
      <meta name="description" content="Eric Moukouri — Front-End Developer, UX/UI Designer and QA Analyst creating high-performance, accessible and user-centered digital products with intuitive interfaces and scalable web solutions.">
      <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
      <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
      <meta name="color-scheme" content="auto light dark">

      <meta name="robots" content="noindex, nofollow">

      <meta property="og:type" content="website">

      <title>Error 404 — Page not found</title>

      <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
      <link rel="icon" type="image/svg+xml" href="/favicon.svg">
      <link rel="shortcut icon" href="/favicon.ico">
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
      <link rel="manifest" href="/site.webmanifest">

      <link rel="stylesheet" href="assets/css/index.css">
      <script type="module" src="assets/js/404.js"></script>
   </head>

    <body>
    
        <a class="skip-link" href="#main-content">Skip to main content</a>
  
        <header>

            <div class="header-content">
            
                <a class="logo" href="index.html" aria-label="Back to homepage">Portfolio</a>
            
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Current theme: Auto. Activate to change theme.">
            
                    <span id="theme-icon" aria-hidden="true">🌓</span>
            
                    <span id="theme-label">Auto</span>
            
                </button>
         
            </div>
      
        </header>

        <main class="error-page" aria-labelledby="error-title">

            <div class="error-content">

                <p class="error-code" aria-hidden="true">
                    404
                </p>
            
                <h1 id="error-title">
                    Page not found
                </h1>
            
                <p class="error-message">
                    Sorry, this page seems to be missing.
                    We are actively working to resolve this issue.
                </p>
            
                <p class="redirect-message" aria-live="polite">
                    Redirecting to the homepage in <strong id="countdown">5</strong> seconds...
                </p>
            
                <a class="home-btn" href="index.html">Back to homepage</a>

            </div>

        </main>

    
        <!-- CODEX C2 ADDITION: global loading transition -->
    
        <!-- <div id="page-loader" class="page-loader" role="status" aria-live="polite" aria-label="Loading" hidden>
    
            <div class="page-loader-content">
    
                <span class="page-loader-spinner" aria-hidden="true"></span>
    
                <span class="page-loader-text">Loading...</span>
    
            </div>
    
        </div> -->

    </body>

</html>
