<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>404 — Page introuvable</title>

    <link
        rel="stylesheet"
        href="assets/css/index.css"
    >

    <script type="module" src="assets/js/404.js"></script>

</head>


<body>

    <main
        class="error-page"
        aria-labelledby="error-title"
    >

        <div class="error-content">

            <p
                class="error-code"
                aria-hidden="true"
            >
                404
            </p>


            <h1 id="error-title">
                Page introuvable
            </h1>


            <p class="error-message">
                Désolé, cette page semble introuvable.
                Nous travaillons activement pour résoudre ce problème.
            </p>


            <p
                class="redirect-message"
                aria-live="polite"
            >
                Redirection vers la page d'accueil dans
                <strong id="countdown">5</strong>
                secondes...
            </p>


            <div
                class="progress-container"
                aria-hidden="true"
            >
                <div
                    id="progress-bar"
                    class="progress-bar"
                ></div>
            </div>


            <a
                class="home-btn"
                href="index.html"
            >
                Retour à l'accueil
            </a>

        </div>

    </main>

    <!-- CODEX C2 ADDITION: global loading transition -->
    <div id="page-loader" class="page-loader" role="status" aria-live="polite" aria-label="Loading" hidden>
        <div class="page-loader-content">
            <span class="page-loader-spinner" aria-hidden="true"></span>
            <span class="page-loader-text">Loading...</span>
        </div>
    </div>

</body>

</html>
