<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">

        <title>Error 404 — Page not found</title>

        <link rel="stylesheet" href="assets/css/index.css">
        <script type="module" src="assets/js/404.js"></script>
    </head>

    <body>

        <main class="error-page" aria-labelledby="error-title">

            <div class="error-content">

                <p class="error-code" aria-hidden="true">
                    404
                </p>
            
                <h1 id="error-title">
                    Page not found
                </h1>
            
                <p class="error-message">
                    Sorry, this page seems to be missing.
                    We are actively working to resolve this issue.
                </p>
            
                <p class="redirect-message" aria-live="polite">
                    Redirecting to the homepage in <strong id="countdown">5</strong> seconds...
                </p>
            
                <a class="home-btn" href="index.html">Back to homepage</a>

            </div>

        </main>

    
        <!-- CODEX C2 ADDITION: global loading transition -->

            <div class="page-loader-content">
    
                <span class="page-loader-spinner" aria-hidden="true"></span>
    
                <span class="page-loader-text">Loading...</span>
    
            </div>
    
        </div> -->

    </body>

</html>
